name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # content.json -> index.html. 항상 다시 만들어서 배포하므로
      # 저장소의 index.html이 낡아 있어도 최신 내용이 올라간다.
      - run: node build.mjs
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  # 업로드와 같은 job에서 배포하면 아티팩트를 못 찾는 경우가 있어(actions/deploy-pages
  # "No artifacts named github-pages") 배포를 별도 job으로 나눈다.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
